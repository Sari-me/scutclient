name: Build OpenWrt scutclient IPK

on:
  workflow_dispatch:

  push:
    branches:
      - master
    paths:
      - "CMakeLists.txt"
      - "src/**"
      - "openwrt/**"
      - ".github/workflows/openwrt-ipk.yml"

  pull_request:
    branches:
      - master
    paths:
      - "CMakeLists.txt"
      - "src/**"
      - "openwrt/**"
      - ".github/workflows/openwrt-ipk.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.arch }} / OpenWrt 22.03.7
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64_generic
          - aarch64_cortex-a53
          - arm_cortex-a7_neon-vfpv4
          - mipsel_24kc

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify source tree
        shell: bash
        run: |
          set -euxo pipefail

          echo "GITHUB_SHA=$GITHUB_SHA"
          git log -1 --oneline

          test -f CMakeLists.txt
          test -f COPYING
          test -d src

          test -f openwrt/Makefile
          test -f openwrt/files/scutclient.config
          test -f openwrt/files/scutclient.init
          test -f openwrt/files/scutclient.hotplug
          test -f openwrt/files/scutclient-mac
          test -f openwrt/files/scutclient-portal-probe

          grep -q '^PKG_NAME:=scutclient$' openwrt/Makefile

      - name: Consistency checks
        shell: bash
        run: |
          set -euxo pipefail

          # init / README 传给 C 程序的 CLI 必须真实存在于 main.c
          for opt in instance expected-mac heartbeat-interval \
                     heartbeat-timeout eap-timeout eap-retries \
                     log-level log-file log-max-size log-keep \
                     auth-method portal-location portal-suffix \
                     portal-connect-timeout portal-timeout \
                     portal-check-interval portal-tls-verify \
                     portal-http-port portal-https-port; do
            grep -q -- "\"$opt\"" src/main.c || {
              echo "Missing CLI option: --$opt"
              exit 1
            }
          done

          # portal 后端必须被编译进二进制（URL 模型 + endpoint builder）
          grep -q 'portal.c' CMakeLists.txt
          grep -q 'portal_url.c' CMakeLists.txt
          grep -q 'portal_endpoint.c' CMakeLists.txt
          grep -q 'CURL' CMakeLists.txt

          # MAC / portal probe helper 必须打包进 ipk
          grep -q 'scutclient-mac' openwrt/Makefile
          grep -q 'scutclient-portal-probe' openwrt/Makefile

          sh -n openwrt/files/scutclient.init
          sh -n openwrt/files/scutclient.hotplug
          sh -n openwrt/files/scutclient-mac
          sh -n openwrt/files/scutclient-portal-probe

      - name: Prepare OpenWrt feed
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf .ci-feed

          mkdir -p .ci-feed/scutclient/files

          cp openwrt/Makefile \
            .ci-feed/scutclient/Makefile

          cp CMakeLists.txt \
            .ci-feed/scutclient/CMakeLists.txt

          cp COPYING \
            .ci-feed/scutclient/COPYING

          cp -a src \
            .ci-feed/scutclient/src

          cp openwrt/files/scutclient.config \
            .ci-feed/scutclient/files/scutclient.config

          cp openwrt/files/scutclient.init \
            .ci-feed/scutclient/files/scutclient.init

          cp openwrt/files/scutclient.hotplug \
            .ci-feed/scutclient/files/scutclient.hotplug

          cp openwrt/files/scutclient-mac \
            .ci-feed/scutclient/files/scutclient-mac

          cp openwrt/files/scutclient-portal-probe \
            .ci-feed/scutclient/files/scutclient-portal-probe

          echo "===== CI feed ====="
          find .ci-feed -maxdepth 4 -type f -print

          echo "===== package Makefile ====="
          cat .ci-feed/scutclient/Makefile

      - name: Build scutclient
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-22.03.7
          FEED_DIR: ${{ github.workspace }}/.ci-feed
          FEEDNAME: scutclient_ci
          PACKAGES: scutclient
          BUILD_LOG: 1
          NO_SHFMT_CHECK: 1
          V: s

      - name: Show build logs on failure
        if: failure()
        shell: bash
        run: |
          echo "===== available logs ====="
          find logs -type f -print 2>/dev/null || true

          echo "===== dump logs ====="
          while IFS= read -r log; do
            echo "----- $log -----"
            cat "$log" || true
          done < <(
            find logs -type f -name 'dump.txt' -print 2>/dev/null || true
          )

          echo "===== compile logs ====="
          while IFS= read -r log; do
            echo "----- $log -----"
            tail -n 300 "$log" || true
          done < <(
            find logs -type f -name 'compile.txt' -print 2>/dev/null || true
          )

      - name: Show generated packages
        if: always()
        shell: bash
        run: |
          find bin -type f \
            \( -name "*.ipk" -o -name "*.apk" \) \
            -print 2>/dev/null || true

      - name: Upload IPK
        uses: actions/upload-artifact@v7
        with:
          name: scutclient-${{ matrix.arch }}-22.03.7
          path: |
            bin/packages/**/scutclient_ci/scutclient_*.ipk
          if-no-files-found: error