name: Build OpenWrt scutclient IPK

on:
  workflow_dispatch:

  push:
    branches:
      - master
    paths:
      - "CMakeLists.txt"
      - "src/**"
      - "openwrt/**"
      - ".github/workflows/openwrt-ipk.yml"

  pull_request:
    branches:
      - master
    paths:
      - "CMakeLists.txt"
      - "src/**"
      - "openwrt/**"
      - ".github/workflows/openwrt-ipk.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.arch }} / OpenWrt 22.03.7
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64_generic
          - aarch64_cortex-a53
          - arm_cortex-a7_neon-vfpv4
          - mipsel_24kc

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify OpenWrt package layout
        shell: bash
        run: |
          set -euxo pipefail
          test -f openwrt/Makefile
          test -f openwrt/files/scutclient.config
          test -f openwrt/files/scutclient.init
          test -f openwrt/files/scutclient.hotplug
          test -f CMakeLists.txt
          test -d src
          grep -q '^PKG_NAME:=scutclient$' openwrt/Makefile

      - name: Build scutclient
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-22.03.7
          FEED_DIR: ${{ github.workspace }}
          FEEDNAME: scutclient_ci
          PACKAGES: scutclient
          BUILD_LOG: 1
          # This workflow is for producing IPKs. Disable the action's optional
          # in-place shfmt gate so shell formatting cannot block compilation.
          NO_SHFMT_CHECK: 1
          V: s

      - name: Show build logs on failure
        if: failure()
        shell: bash
        run: |
          echo "===== available build logs ====="
          find logs -type f -print 2>/dev/null || true
          echo "===== compile log tails ====="
          while IFS= read -r log; do
            echo "----- $log -----"
            tail -n 200 "$log" || true
          done < <(find logs -type f -name 'compile.txt' -print 2>/dev/null || true)

      - name: Show generated packages
        if: always()
        shell: bash
        run: |
          find bin -type f \( -name "*.ipk" -o -name "*.apk" \) -print 2>/dev/null || true

      - name: Upload IPK
        uses: actions/upload-artifact@v7
        with:
          name: scutclient-${{ matrix.arch }}-22.03.7
          path: bin/packages/**/scutclient_ci/scutclient_*.ipk
          if-no-files-found: error